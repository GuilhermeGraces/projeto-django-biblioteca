<div class="livro card bg-base-100 shadow-sm">
    <div class="card-body">
        <h2 class="card-title">{{ livro.titulo }}</h2>
        <p class="text-base-content/70">{{ livro.autor }}</p>

        <div class="card-actions justify-end">
            <button class="btn btn-sm btn-outline" hx-get="{% url 'editar' livro.pk %}" hx-target="closest .livro" hx-swap="outerHTML">Editar</button>
            <form hx-post="{% url 'deletar' livro.pk %}" hx-confirm="Tem certeza que deseja deletar {{ livro.titulo }}?" hx-target="closest .livro" hx-swap="outerHTML">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-outline btn-error">Deletar</button>
            </form>
        </div>
    </div>
</div>
