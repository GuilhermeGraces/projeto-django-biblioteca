{% extends "biblioteca/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <div class="hero bg-base-100 rounded-box shadow-sm py-12">
        <div class="hero-content text-center">
            <div>
                {% if user.is_authenticated %}
                    <h1 class="text-4xl font-bold">Olá, {{ user.username }}!</h1>
                {% else %}
                    <h1 class="text-4xl font-bold">Olá, Visitante!</h1>
                {% endif %}
                <p class="py-4 text-base-content/70">Consulte, edite e organize os livros da biblioteca.</p>
                <a href="{% url 'livros' %}" class="btn btn-primary">Ver livros</a>
            </div>
        </div>
    </div>
{% endblock %}
